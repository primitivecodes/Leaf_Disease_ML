services:
  api:
    build: .
    volumes: ["./data:/app/data", "./models:/app/models"]
    environment:
      RETRAIN_THRESHOLD: "50"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      REQUIRE_ADMIN_API_KEY: ${REQUIRE_ADMIN_API_KEY:-true}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-100}
      MAX_UPLOAD_TOTAL_BYTES: ${MAX_UPLOAD_TOTAL_BYTES:-52428800}
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
    expose: ["8000"]
  lb:
    image: nginx:alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8000:80"]
    depends_on: [api]
  ui:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    volumes: ["./data:/app/data", "./models:/app/models"]
    environment:
      API_URL: http://lb
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      UI_USERNAME: ${UI_USERNAME:-}
      UI_PASSWORD: ${UI_PASSWORD:-}
    ports: ["8501:8501"]
    depends_on: [lb]
